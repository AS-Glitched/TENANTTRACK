<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Bill')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="page-header">
        <h2><i class="bi bi-receipt"></i> Add Bill</h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/bills/save}" th:object="${bill}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{title}" id="title"
                               placeholder="e.g. Electricity - Sept"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{category}" id="category" required>
                            <option value="">Select...</option>
                            <option value="ELECTRICITY">Electricity</option>
                            <option value="WATER">Water</option>
                            <option value="MAINTENANCE">Maintenance</option>
                            <option value="OTHER">Other</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="amount" class="form-label">Amount (₹) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{amount}" id="amount"
                               step="0.01" min="0.01"
                               th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="dueDate" class="form-label">Due Date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" th:field="*{dueDate}" id="dueDate"
                               th:classappend="${#fields.hasErrors('dueDate')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="propertySelect" class="form-label">Property <span class="text-danger">*</span></label>
                        <select name="propertyId" id="propertySelect" class="form-select" required>
                            <option value="">Select Property...</option>
                            <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="tenantSelect" class="form-label">Tenant (optional — leave blank for property-level bill)</label>
                        <select name="tenantId" id="tenantSelect" class="form-select">
                            <option value="">No tenant (property-level)</option>
                            <option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName + ' (' + t.property.name + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-rf-primary">
                        <i class="bi bi-check-lg"></i> Save Bill
                    </button>
                    <a th:href="@{/bills}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
