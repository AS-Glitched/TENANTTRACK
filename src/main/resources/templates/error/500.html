<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
    <div class="empty-state mt-5">
        <i class="bi bi-exclamation-octagon" style="font-size: 5rem; color: var(--rf-danger);"></i>
        <h2 class="mt-3">500 — Something Went Wrong</h2>
        <p class="text-muted">An unexpected error occurred. Please try again later.</p>
        <a th:href="@{/}" class="btn btn-rf-primary mt-2">
            <i class="bi bi-house"></i> Go Home
        </a>
    </div>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
