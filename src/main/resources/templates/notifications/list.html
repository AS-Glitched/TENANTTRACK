<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="page-header">
        <h2><i class="bi bi-bell"></i> Notifications</h2>
        <a th:href="@{/notifications/read-all}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-check-all"></i> Mark All Read
        </a>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="card">
        <div class="card-body empty-state">
            <i class="bi bi-bell-slash"></i>
            <h5>No notifications</h5>
            <p>You're all caught up!</p>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(notifications)}">
        <div th:each="n : ${notifications}"
             th:classappend="${n.isRead == 0} ? 'unread'"
             class="notification-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge bg-primary me-1" th:if="${n.type == 'RENT_DUE_SOON'}">Rent Due Soon</span>
                    <span class="badge bg-danger me-1" th:if="${n.type == 'RENT_OVERDUE'}">Rent Overdue</span>
                    <span class="badge bg-warning text-dark me-1" th:if="${n.type == 'BILL_DUE'}">Bill Due</span>
                    <span class="badge bg-secondary me-1" th:text="${n.channel}"></span>
                    <p class="mb-0 mt-1" th:text="${n.message}"></p>
                    <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm')}"></small>
                </div>
                <div th:if="${n.isRead == 0}">
                    <a th:href="@{/notifications/read/{id}(id=${n.id})}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-check"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
