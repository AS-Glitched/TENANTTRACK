<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Property')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="page-header">
        <h2>
            <i class="bi bi-building"></i>
            <span th:text="${property.id != null ? 'Edit Property' : 'New Property'}"></span>
        </h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/properties/save}" th:object="${property}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="name" class="form-label">Property Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}" id="name"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{address}" id="address"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-rf-primary">
                        <i class="bi bi-check-lg"></i> Save
                    </button>
                    <a th:href="@{/properties}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
