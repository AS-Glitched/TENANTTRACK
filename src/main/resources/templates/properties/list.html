<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Properties')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="page-header">
        <h2><i class="bi bi-building"></i> Properties</h2>
        <a th:href="@{/properties/new}" class="btn btn-rf-primary">
            <i class="bi bi-plus-lg"></i> Add Property
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(properties)}" class="empty-state">
                <i class="bi bi-building"></i>
                <h5>No properties yet</h5>
                <p>Add your first property to get started.</p>
            </div>
            <table th:unless="${#lists.isEmpty(properties)}" class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="property : ${properties}">
                        <td th:text="${property.id}"></td>
                        <td>
                            <strong th:text="${property.name}"></strong>
                        </td>
                        <td th:text="${property.address}"></td>
                        <td>
                            <a th:href="@{/properties/edit/{id}(id=${property.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <a th:href="@{/properties/delete/{id}(id=${property.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this property?')">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
