<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rent Ledger')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="page-header">
        <h2>
            <i class="bi bi-cash-stack"></i> Rent Ledger —
            <span th:text="${tenant.fullName}"></span>
        </h2>
        <a th:href="@{/tenants/detail/{id}(id=${tenant.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Tenant
        </a>
    </div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card info">
                <div class="card-body text-center">
                    <div class="stat-label">Monthly Rent</div>
                    <div class="stat-value" th:text="'₹' + ${#numbers.formatDecimal(tenant.monthlyRent, 1, 0)}"></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <div class="stat-label">Due Day</div>
                    <div class="stat-value" th:text="${tenant.rentDueDay}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Record Payment Form -->
    <div class="card mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Record Payment</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/rent/record}" method="post" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Period</label>
                    <select name="paymentId" class="form-select" required>
                        <th:block th:each="p : ${payments}">
                            <option th:if="${p.status != 'PAID'}" th:value="${p.id}"
                                    th:text="${p.periodMonth + ' (₹' + #numbers.formatDecimal(p.balance, 1, 0) + ' remaining)'}"></option>
                        </th:block>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date Paid</label>
                    <input type="date" name="paidDate" class="form-control" th:value="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-rf-primary w-100">
                        <i class="bi bi-check-lg"></i> Record
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Payment History -->
    <div class="card">
        <div class="card-header bg-white">
            <h5 class="mb-0"><i class="bi bi-clock-history"></i> Payment History</h5>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(payments)}" class="empty-state">
                <i class="bi bi-cash-stack"></i>
                <h5>No payment records</h5>
            </div>
            <div th:unless="${#lists.isEmpty(payments)}" class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Amount Due</th>
                            <th>Amount Paid</th>
                            <th>Balance</th>
                            <th>Paid Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${payments}">
                            <td th:text="${p.periodMonth}"></td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(p.amountDue, 1, 0)}"></td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(p.amountPaid, 1, 0)}"></td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(p.balance, 1, 0)}"></td>
                            <td th:text="${p.paidDate != null ? #temporals.format(p.paidDate, 'dd MMM yyyy') : '-'}"></td>
                            <td>
                                <span class="badge-status badge-paid" th:if="${p.status == 'PAID'}">Paid</span>
                                <span class="badge-status badge-due" th:if="${p.status == 'DUE'}">Due</span>
                                <span class="badge-status badge-partial" th:if="${p.status == 'PARTIAL'}">Partial</span>
                                <span class="badge-status badge-overdue" th:if="${p.status == 'OVERDUE'}">Overdue</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
