<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tenant Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="page-header">
        <h2>
            <i class="bi bi-person-circle"></i>
            <span th:text="${tenant.fullName}"></span>
            <span class="badge-status badge-active ms-2" th:if="${tenant.status == 'ACTIVE'}">Active</span>
            <span class="badge-status badge-past ms-2" th:if="${tenant.status == 'PAST'}">Past</span>
            <span class="badge-status badge-notice ms-2" th:if="${tenant.status == 'NOTICE_GIVEN'}">Notice</span>
        </h2>
        <div>
            <a th:href="@{/tenants/edit/{id}(id=${tenant.id})}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil"></i> Edit
            </a>
            <a th:href="@{/rent/tenant/{id}(id=${tenant.id})}" class="btn btn-rf-primary btn-sm">
                <i class="bi bi-cash-stack"></i> Rent Ledger
            </a>
        </div>
    </div>

    <!-- Profile Card -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Property:</strong> <span th:text="${tenant.property.name}"></span></p>
                    <p><strong>Unit:</strong> <span th:text="${tenant.unitLabel ?: 'N/A'}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${tenant.email ?: 'N/A'}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${tenant.phone ?: 'N/A'}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Monthly Rent:</strong> <span class="fw-bold text-primary" th:text="'₹' + ${#numbers.formatDecimal(tenant.monthlyRent, 1, 0)}"></span></p>
                    <p><strong>Rent Due Day:</strong> <span th:text="${tenant.rentDueDay}"></span> of each month</p>
                    <p><strong>Lease:</strong>
                        <span th:text="${#temporals.format(tenant.leaseStart, 'dd MMM yyyy')}"></span>
                        <span th:if="${tenant.leaseEnd}"> &mdash; <span th:text="${#temporals.format(tenant.leaseEnd, 'dd MMM yyyy')}"></span></span>
                        <span th:unless="${tenant.leaseEnd}"> &mdash; Ongoing</span>
                    </p>
                    <p th:if="${tenant.notes}"><strong>Notes:</strong> <span th:text="${tenant.notes}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Rent History -->
        <div class="col-md-7">
            <div class="card mb-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-cash-stack"></i> Rent History</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(rentPayments)}" class="empty-state">
                        <i class="bi bi-cash-stack"></i>
                        <p>No rent records yet.</p>
                    </div>
                    <table th:unless="${#lists.isEmpty(rentPayments)}" class="table table-sm">
                        <thead>
                            <tr>
                                <th>Period</th>
                                <th>Due</th>
                                <th>Paid</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rp : ${rentPayments}">
                                <td th:text="${rp.periodMonth}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(rp.amountDue, 1, 0)}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(rp.amountPaid, 1, 0)}"></td>
                                <td>
                                    <span class="badge-status badge-paid" th:if="${rp.status == 'PAID'}">Paid</span>
                                    <span class="badge-status badge-due" th:if="${rp.status == 'DUE'}">Due</span>
                                    <span class="badge-status badge-partial" th:if="${rp.status == 'PARTIAL'}">Partial</span>
                                    <span class="badge-status badge-overdue" th:if="${rp.status == 'OVERDUE'}">Overdue</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Bills -->
        <div class="col-md-5">
            <div class="card mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-receipt"></i> Bills</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(bills)}" class="empty-state">
                        <i class="bi bi-receipt"></i>
                        <p>No bills yet.</p>
                    </div>
                    <table th:unless="${#lists.isEmpty(bills)}" class="table table-sm">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="bill : ${bills}">
                                <td th:text="${bill.title}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(bill.amount, 1, 0)}"></td>
                                <td>
                                    <span class="badge-status badge-paid" th:if="${bill.status == 'PAID'}">Paid</span>
                                    <span class="badge-status badge-unpaid" th:if="${bill.status == 'UNPAID'}">Unpaid</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
