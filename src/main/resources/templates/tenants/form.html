<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tenant')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="page-header">
        <h2>
            <i class="bi bi-person-plus"></i>
            <span th:text="${tenant.id != null ? 'Edit Tenant' : 'New Tenant'}"></span>
        </h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/tenants/save}" th:object="${tenant}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="propertyId" th:value="${tenant.property != null ? tenant.property.id : ''}">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{fullName}" id="fullName"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="propertySelect" class="form-label">Property <span class="text-danger">*</span></label>
                        <select name="propertyId" id="propertySelect" class="form-select" required>
                            <option value="">Select Property...</option>
                            <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.name}"
                                    th:selected="${tenant.property != null && tenant.property.id == p.id}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" id="email">
                    </div>
                    <div class="col-md-4">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" class="form-control" th:field="*{phone}" id="phone">
                    </div>
                    <div class="col-md-4">
                        <label for="unitLabel" class="form-label">Unit Label</label>
                        <input type="text" class="form-control" th:field="*{unitLabel}" id="unitLabel" placeholder="e.g. 2B">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-3">
                        <label for="leaseStart" class="form-label">Lease Start <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" th:field="*{leaseStart}" id="leaseStart"
                               th:classappend="${#fields.hasErrors('leaseStart')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('leaseStart')}" th:errors="*{leaseStart}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="leaseEnd" class="form-label">Lease End</label>
                        <input type="date" class="form-control" th:field="*{leaseEnd}" id="leaseEnd">
                    </div>
                    <div class="col-md-3">
                        <label for="monthlyRent" class="form-label">Monthly Rent (₹) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{monthlyRent}" id="monthlyRent"
                               step="0.01" min="0.01"
                               th:classappend="${#fields.hasErrors('monthlyRent')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('monthlyRent')}" th:errors="*{monthlyRent}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="rentDueDay" class="form-label">Rent Due Day (1-31) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{rentDueDay}" id="rentDueDay"
                               min="1" max="31"
                               th:classappend="${#fields.hasErrors('rentDueDay')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('rentDueDay')}" th:errors="*{rentDueDay}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}" id="status">
                            <option value="ACTIVE">Active</option>
                            <option value="PAST">Past</option>
                            <option value="NOTICE_GIVEN">Notice Given</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" th:field="*{notes}" id="notes" rows="2"></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-rf-primary">
                        <i class="bi bi-check-lg"></i> Save Tenant
                    </button>
                    <a th:href="@{/tenants}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
