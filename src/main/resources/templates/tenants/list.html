<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tenants')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="page-header">
        <h2><i class="bi bi-people"></i> Tenants</h2>
        <a th:href="@{/tenants/new}" class="btn btn-rf-primary">
            <i class="bi bi-plus-lg"></i> Add Tenant
        </a>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/tenants}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Property</label>
                    <select name="propertyId" class="form-select">
                        <option value="">All Properties</option>
                        <option th:each="p : ${properties}" th:value="${p.id}" th:text="${p.name}"
                                th:selected="${selectedPropertyId != null && selectedPropertyId == p.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Active</option>
                        <option value="PAST" th:selected="${selectedStatus == 'PAST'}">Past</option>
                        <option value="NOTICE_GIVEN" th:selected="${selectedStatus == 'NOTICE_GIVEN'}">Notice Given</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="bi bi-funnel"></i> Filter
                    </button>
                    <a th:href="@{/tenants}" class="btn btn-outline-secondary">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(tenants)}" class="empty-state">
                <i class="bi bi-people"></i>
                <h5>No tenants found</h5>
                <p>Add your first tenant or adjust the filters.</p>
            </div>
            <div th:unless="${#lists.isEmpty(tenants)}" class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Property</th>
                            <th>Unit</th>
                            <th>Rent</th>
                            <th>Due Day</th>
                            <th>Next Due</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="tenant : ${tenants}">
                            <td>
                                <a th:href="@{/tenants/detail/{id}(id=${tenant.id})}" class="text-decoration-none fw-bold">
                                    <th:block th:text="${tenant.fullName}"></th:block>
                                </a>
                            </td>
                            <td th:text="${tenant.property.name}"></td>
                            <td th:text="${tenant.unitLabel ?: '-'}"></td>
                            <td>
                                <span class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(tenant.monthlyRent, 1, 0)}"></span>
                            </td>
                            <td th:text="${tenant.rentDueDay}"></td>
                            <td th:text="${#temporals.format(tenant.nextDueDate, 'dd MMM yyyy')}"></td>
                            <td>
                                <span class="badge-status badge-active" th:if="${tenant.status == 'ACTIVE'}">Active</span>
                                <span class="badge-status badge-past" th:if="${tenant.status == 'PAST'}">Past</span>
                                <span class="badge-status badge-notice" th:if="${tenant.status == 'NOTICE_GIVEN'}">Notice Given</span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/tenants/detail/{id}(id=${tenant.id})}" class="btn btn-outline-info" title="View">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/tenants/edit/{id}(id=${tenant.id})}" class="btn btn-outline-primary" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/tenants/delete/{id}(id=${tenant.id})}" class="btn btn-outline-danger" title="Delete"
                                       onclick="return confirm('Delete this tenant?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
